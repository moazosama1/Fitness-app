<!DOCTYPE html>
<html>

<head>
  <base href="/Fitness-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Super Fitness app built with Flutter.">
  <meta name="theme-color" content="#242424">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Super Fitness">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Super Fitness</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #242424;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      background-color: #242424;
      z-index: 9999;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #3a3a3a;
      border-bottom-color: #ff4100;
      border-radius: 50%;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }

    .loading-text {
      color: #fefefe;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.65;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body oncontextmenu="return false;">
  <div id="loading_indicator" class="splash-container">
    <span class="loader"></span>
    <div class="loading-text">Super Fitness...</div>
  </div>

  <script>
    window.addEventListener("load", function () {
      var hideLoader = function () {
        var indicator = document.getElementById("loading_indicator");
        if (!indicator) return;
        indicator.style.transition = "opacity 0.35s ease-out";
        indicator.style.opacity = "0";
        setTimeout(function () {
          if (indicator && indicator.parentNode) {
            indicator.parentNode.removeChild(indicator);
          }
        }, 350);
      };

      window.addEventListener("flutter-first-frame", hideLoader, { once: true });

      // Fallback in case the event is delayed.
      setTimeout(hideLoader, 5000);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
